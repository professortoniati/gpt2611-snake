<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Snake</title>
<style>
body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial;
  text-align:center;
}
h1{color:#0f0}
canvas{
  background:#000;
  border:3px solid #0f0;
  display:block;
  margin:20px auto;
}
p{font-size:20px}
</style>
</head>

<body>
<h1>🐍 Snake</h1>
<p>Pontos: <span id="score">0</span></p>
<canvas id="game" width="400" height="400"></canvas>
<p>Use as setas ou WASD | Espaço para reiniciar</p>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const size=20;
let snake, fruit, dx, dy, score, gameOver;

function start(){
  snake=[
    {x:200,y:200},
    {x:180,y:200},
    {x:160,y:200}
  ];
  fruit=randomFruit();
  dx=size;
  dy=0;
  score=0;
  gameOver=false;
  document.getElementById("score").textContent=score;
}

function randomFruit(){
  return {
    x:Math.floor(Math.random()*20)*size,
    y:Math.floor(Math.random()*20)*size
  };
}

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowUp"||e.key==="w"||e.key==="W"){
    if(dy===0){dx=0;dy=-size;}
  }
  if(e.key==="ArrowDown"||e.key==="s"||e.key==="S"){
    if(dy===0){dx=0;dy=size;}
  }
  if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A"){
    if(dx===0){dx=-size;dy=0;}
  }
  if(e.key==="ArrowRight"||e.key==="d"||e.key==="D"){
    if(dx===0){dx=size;dy=0;}
  }
  if(e.code==="Space" && gameOver) start();
});

function update(){
  if(gameOver)return;

  let head={
    x:snake[0].x+dx,
    y:snake[0].y+dy
  };

  if(
    head.x<0||
    head.y<0||
    head.x>=canvas.width||
    head.y>=canvas.height||
    snake.some(p=>p.x===head.x&&p.y===head.y)
  ){
    gameOver=true;
    return;
  }

  snake.unshift(head);

  if(head.x===fruit.x && head.y===fruit.y){
    score++;
    document.getElementById("score").textContent=score;
    fruit=randomFruit();
  }else{
    snake.pop();
  }
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle="red";
  ctx.fillRect(fruit.x,fruit.y,size,size);

  ctx.fillStyle="#0f0";
  snake.forEach((p,i)=>{
    ctx.fillRect(p.x,p.y,size,size);
  });

  if(gameOver){
    ctx.fillStyle="white";
    ctx.font="30px Arial";
    ctx.fillText("GAME OVER",90,190);
    ctx.font="18px Arial";
    ctx.fillText("Pressione ESPAÇO",100,230);
  }
}

function loop(){
  update();
  draw();
}

start();
setInterval(loop,120);
</script>
</body>
</html>
